<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="icon" href="assets/resources/icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Best Client — Login</title>
    <style>
        :root {
            --bg-dark: #121216;
            --bg-card: #1c1c24;
            --accent: #913de2;
            --accent-hover: #7a2bc7;
            --text-main: #eaeaea;
            --text-muted: #a0a0b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background-color: var(--bg-card);
            border-bottom: 1px solid #2a2a35;
        }

        .icon {
            width: 36px;
            height: 36px;
            border-radius: 6px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
            background-color: var(--bg-card);
            border-radius: 12px;
            border: 1px solid #2a2a35;
            text-align: center;
        }

        .login-card img {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
        }

        .login-card h1 {
            font-size: 1.75rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-dark);
            border: 1px solid #2a2a35;
            border-radius: 6px;
            color: var(--text-main);
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .submit-btn {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background-color: var(--accent-hover);
        }

        footer {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid #2a2a35;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="icon-link">
            <img src="assets/resources/icon.png" alt="Best Client Icon" class="icon">
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="faq.html">FAQ</a>
            <a href="https://github.com" target="_blank">GitHub</a>
        </div>
        <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">← Back</a>
    </nav>

    <div class="login-wrapper">
        <div class="login-card">
            <img src="assets/resources/icon.png" alt="Best Client Logo">
            <h1>Client Login</h1>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="submit-btn">Sign In</button>
            </form>
        </div>
    </div>

    <footer>
        <p>Copyright © 2026 Best Client Development</p>
        <p>All Rights Reserved.</p>
    </footer>

</body>
</html>
